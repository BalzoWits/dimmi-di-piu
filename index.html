<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6f5">
<title>Dimmi di più · Tell Me More</title>
<meta name="description" content="Dimmi di più / Tell Me More: un gioco di carte per parlarsi davvero, in italiano e in inglese.">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,800;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="home">

<header class="bar">
  <button class="icon-btn" id="back" aria-label="Indietro" data-i18n-aria="back">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <a class="brand" href="#" id="brand">
    <span class="mark" aria-hidden="true"><i></i><i></i></span>
    <span class="brand-name" data-i18n="brand">Dimmi di più</span>
  </a>
  <div class="lang" role="group" aria-label="Lingua / Language">
    <button data-lang="it">IT</button><button data-lang="en">EN</button>
  </div>
</header>

<main>
  <!-- scelta del mazzo -->
  <section id="home" class="screen">
    <div class="hero">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="title"></h1>
      <p class="lead" data-i18n="lead"></p>
    </div>
    <div class="decks" id="decks"></div>
    <p class="foot" data-i18n="foot"></p>
  </section>

  <!-- partita -->
  <section id="game" class="screen">
    <div class="game-head">
      <div>
        <p class="eyebrow" id="game-sub"></p>
        <h2 id="game-title"></h2>
      </div>
      <button class="ghost" id="shuffle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3.5c2 0 3.2 1 4.3 2.7l1.4 2.6c1 1.7 2.3 2.7 4.3 2.7H20M4 17h3.5c1.2 0 2.2-.4 3-1.1M13.5 8.1c.8-.7 1.8-1.1 3-1.1H20M17 4l3 3-3 3M17 14l3 3-3 3"/></svg>
        <span data-i18n="shuffle"></span>
      </button>
    </div>

    <div class="levels" id="levels" role="tablist"></div>

    <div class="table">
      <button class="nav prev" id="prev" aria-label="Carta precedente" data-i18n-aria="prev">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="stage" id="stage">
        <div class="pile" aria-hidden="true"><span></span><span></span></div>
      </div>
      <button class="nav next" id="next-side" aria-label="Carta successiva" data-i18n-aria="next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="controls">
      <div class="progress"><span id="bar"></span></div>
      <div class="row">
        <span class="count" id="count"></span>
        <button class="draw" id="draw"><span data-i18n="draw"></span></button>
        <span class="hint" id="hint"></span>
      </div>
    </div>
  </section>
</main>

<script src="js/decks.js"></script>
<script src="js/app.js"></script>
</body>
</html>
